name: eyonexis-dev

services:
  db:
    image: mariadb:10.6.24
    container_name: eyonexis-database-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - ./db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - web
      - internal

  phpmyadmin:
    profiles:
      - dev
    image: phpmyadmin/phpmyadmin
    container_name: eyonexis-phpmyadmin-dev
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - web
      - internal
volumes:
  db_data:

networks:
  web:
    external: true
    name: web
  internal:
    internal: true
