[package]
name = "eyonexis-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serveur HTTP
axum = "0.8.8"

# Runtime asynchrone
tokio = { version = "1", features = ["full"] }

# Base de données (SQL pur avec vérification)
sqlx = { version = "0.8.6", features = ["chrono", "postgres", "runtime-tokio", "uuid", "json"] }

# JSON (sérialisation/désérialisation)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# .env
dotenvy = "0.15"
chrono = { version = "0.4.44", features = ["serde"] }
tower-http = { version = "0.6.8", features = ["cors"] }
